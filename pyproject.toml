[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nettlelang"
version = "0.0.1"
description = "Minimal utilities for demonstrating language models, a companion to nettle."
requires-python = ">=3.9"
dependencies = [
    "torch",
    "matplotlib",
]

[tool.setuptools]
py-modules = ["nettlelang"]
